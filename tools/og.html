<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#0A0A0A;color:#EBEBEB;font-family:Archivo;display:flex;align-items:center;position:relative;padding:0 80px;box-sizing:border-box;overflow:hidden}
h1{font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:150px;line-height:.9;letter-spacing:-.035em;margin:0}
.bar{height:14px;width:200px;background:#F74E82;margin:28px 0 30px}
p{font-size:32px;line-height:1.35;color:#B1B1B1;margin:0;max-width:640px}
.bug{display:flex;font-stretch:125%;text-transform:uppercase;margin-top:44px}
.bug div{padding:10px 20px;font-weight:900;font-size:34px;font-variant-numeric:tabular-nums}
.a{background:#141414;box-shadow:inset 0 -6px 0 #F74E82}.b{background:#141414;box-shadow:inset 0 -6px 0 #C8F253}.c{background:#F74E82;color:#111}
img{position:absolute;right:36px;bottom:-14px;width:350px;height:350px}
</style></head><body>
<div><h1>Dropped</h1><div class="bar"></div><p>Land somewhere on Earth. Pin where you think you are. Closest pin wins.</p>
<div class="bug"><div class="a">4,212</div><div class="b">3,980</div><div class="c">0:11</div></div></div>
<img src="../icons/out/a-on-page.png" alt="">
</body></html>
